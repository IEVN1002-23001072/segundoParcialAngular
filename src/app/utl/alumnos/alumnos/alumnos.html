<div class="w-full p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <div
    class="max-w-7xl mx-auto bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden"
  >
    <div class="bg-gray-900 px-6 py-5">
      <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-wide">
        Alumnos
      </h1>
    </div>

    <div class="p-5 sm:p-8">
      <div class="flex flex-col sm:flex-row sm:items-end gap-5 mb-6">
        <button
          type="button"
          [routerLink]="['/utl/agregar']"
          class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition duration-200"
        >
          agregar
        </button>

        <div class="flex-1">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Filtrar por:
          </label>
          <input
            [(ngModel)]="listFilter"
            type="text"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Ingrese nombre del Alumno"
          />
        </div>
      </div>

      <div class="mb-6 p-4 bg-blue-50 border border-blue-100 rounded-lg">
        <h3 class="text-sm font-semibold text-gray-700">
          Filtro: <span class="text-blue-700 font-medium">{{listFilter}}</span>
        </h3>
      </div>

      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table
          class="w-full table-auto text-sm text-left text-gray-600"
          *ngIf="alumnosIric.length>0"
        >
          <thead
            class="text-xs uppercase tracking-wider text-gray-700 bg-gray-100 border-b border-gray-200"
          >
            <tr>
              <th class="px-4 py-4 font-bold whitespace-nowrap">Matricula</th>
              <th class="px-4 py-4 font-bold whitespace-nowrap">Nombre</th>
              <th class="px-4 py-4 font-bold whitespace-nowrap">apaterno</th>
              <th class="px-4 py-4 font-bold whitespace-nowrap">amaterno</th>
              <th class="px-4 py-4 font-bold whitespace-nowrap">correo</th>
              <th class="px-4 py-4 font-bold text-center whitespace-nowrap" 
              [routerLink]="['/utl/editar']">
                editar
              </th>
              <th class="px-4 py-4 font-bold text-center whitespace-nowrap">
                eliminar
              </th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200">
            <tr
              *ngFor="let alumno of dataSource.alumnos | alumnoFilter:listFilter"
              class="bg-white hover:bg-blue-50 transition duration-150"
            >
              <td class="px-4 py-4 whitespace-nowrap font-medium text-gray-900">
                {{alumno.matricula}}
              </td>

              <td class="px-4 py-4 whitespace-nowrap">{{alumno.nombre}}</td>

              <td class="px-4 py-4 whitespace-nowrap">{{alumno.apaterno}}</td>

              <td class="px-4 py-4 whitespace-nowrap">{{alumno.amaterno}}</td>

              <td class="px-4 py-4">{{alumno.correo}}</td>

              <td class="px-4 py-4 text-center">
                <button
                  [routerLink]="['/utl/editar', alumno.matricula]"
                  class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white font-medium rounded-md shadow-sm transition duration-200"
                >
                  editar
                </button>
              </td>

              <td class="px-4 py-4 text-center">
                <button
                  [routerLink]="['/utl/eliminar', alumno.matricula]"
                  class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white font-medium rounded-md shadow-sm transition duration-200"
                >
                  eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
