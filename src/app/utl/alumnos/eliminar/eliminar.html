<div class="bg-white border border-gray-200 rounded-lg shadow-md py-12 px-6">

  <div class="max-w-md mx-auto text-center">

    <h2 class="text-2xl font-bold text-gray-900 mb-4">
      Eliminar alumno
    </h2>

    <p class="text-gray-600 mb-6">
      ¿Estás seguro de que deseas eliminar este alumno?
      Esta acción no se puede deshacer.
    </p>

    <div class="bg-gray-50 rounded-lg p-5 text-left mb-6">

      <p class="mb-2">
        <strong>Matrícula:</strong> {{ alumno.matricula }}
      </p>

      <p class="mb-2">
        <strong>Nombre:</strong> {{ alumno.nombre }}
      </p>

      <p class="mb-2">
        <strong>Apellido paterno:</strong> {{ alumno.apaterno }}
      </p>

      <p class="mb-2">
        <strong>Apellido materno:</strong> {{ alumno.amaterno }}
      </p>

      <p>
        <strong>Correo:</strong> {{ alumno.correo }}
      </p>

    </div>

    <button
      type="button"
      (click)="eliminarAlumno()"
      class="text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2">

      Eliminar

    </button>

    <button
      type="button"
      [routerLink]="['/utl/alumnos']"
      class="text-white bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5">

      Cancelar

    </button>

  </div>

</div>
